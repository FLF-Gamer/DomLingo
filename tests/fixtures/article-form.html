<!doctype html>
<html lang="en">
  <body>
    <main id="form-main">
      <h1>Search this public knowledge article</h1>
      <p>
        Use the controls below to find a topic inside the article without changing your account or
        submitting private information.
      </p>
      <form>
        <label for="query">Article search query</label>
        <input id="query" type="search" placeholder="Search the public article" aria-label="Search article">
        <input type="submit" value="Find article">
        <button type="button" title="Clear the current search">Clear search</button>
      </form>
      <img src="search-help.png" alt="An illustration of the article search controls">
    </main>
  </body>
</html>
