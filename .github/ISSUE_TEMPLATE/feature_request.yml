name: Feature request
description: 提议与网页正文翻译单一用途直接相关的功能
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 先说明用户遇到的问题，不要只描述解决方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 与产品范围的关系
      description: 说明为什么它仍属于“用户主动触发的网页正文翻译”。
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 产品边界
      options:
        - label: 该功能不要求绕过登录、订阅、付费墙、DRM 或其他访问控制
          required: true
        - label: 该功能不要求抓取、导出、托管或公开分享完整网页译文
          required: true
        - label: 该功能不要求在未获得用户主动操作时采集网页正文
          required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 是否可以用现有配置、自定义 Prompt 或更小的改动解决？
